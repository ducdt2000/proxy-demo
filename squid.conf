http_port 3128
http_access allow all 

# ICAP configuration for reqmod and respmod
# You need to replace 'icap://icap.example.com/reqmod' and 'icap://icap.example.com/respmod'
# with the actual addresses of your ICAP server.

icap_enable on

# Increase ICAP timeouts to prevent "options fetch failure"
icap_connect_timeout 10 seconds
icap_io_timeout 30 seconds
icap_service_failure_limit -1
icap_service_revival_delay 30
icap_preview_enable off
icap_preview_size 1024
adaptation_send_client_ip on
adaptation_send_username on

# Request Modification (reqmod) - Chained ICAP services with routing enabled
# SECURITY WARNING: routing=on allows ICAP services to control request routing
# Only enable for trusted ICAP services that validate service names properly
icap_service reqmod_service1 reqmod_precache bypass=1 routing=on icap://icap-server:1344/reqmod
icap_service reqmod_service2 reqmod_precache bypass=1 routing=on icap://icap-server2:1344/reqmod

# Response Modification (respmod) - Chained ICAP services with routing enabled
icap_service respmod_service1 respmod_precache bypass=1 routing=on icap://icap-server:1344/respmod
icap_service respmod_service2 respmod_precache bypass=1 routing=on icap://icap-server2:1344/respmod

# Adaptation chain configuration
adaptation_service_chain reqmod_chain reqmod_service1 reqmod_service2
adaptation_service_chain respmod_chain respmod_service1 respmod_service2

# Access rules for chained services
adaptation_service_set respmod_chain
adaptation_access respmod_chain allow all

debug_options 93,5